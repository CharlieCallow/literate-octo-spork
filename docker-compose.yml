services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forte
      POSTGRES_PASSWORD: forte
      POSTGRES_DB: forte
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forte"]
      interval: 5s

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./api:/app/api
      - ./team:/app/team
      - ./assets:/app/assets
      - reports:/data/reports

  worker:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "-m", "api.workflow.worker"]
    volumes:
      - ./api:/app/api
      - ./team:/app/team
      - ./assets:/app/assets
      - reports:/data/reports

  web:
    build: { context: ./web }
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  reports:
