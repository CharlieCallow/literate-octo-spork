[project]
name = "forte-research"
version = "0.1.0"
description = "Multi-agent thematic research reports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "anthropic>=0.40",
  "boto3>=1.35",
  "playwright>=1.48",
  "jinja2>=3.1",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "numpy>=2.0",
  "fredapi>=0.5",
  "yfinance>=0.2",
  "requests>=2.32",
  "httpx>=0.27",
  "bcrypt>=4.2",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.18",
  "tenacity>=9.0",
  "structlog>=24.4",
  "markdown-it-py>=3.0",
  "pillow>=11.0",
  "pypdf>=5.1",
  "pymupdf>=1.24",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "ruff>=0.7",
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["reports/", "team/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: Depends() in default args is intentional, not a B008 violation.
"api/routes/*.py" = ["B008"]
"api/auth.py" = ["B008"]
# UP042 wants StrEnum; (str, Enum) inheritance still has different runtime
# semantics in libraries we depend on. N818 wants Error suffixes; we keep
# BudgetExceeded short and idiomatic.
"api/models.py" = ["UP042"]
"api/agents/cost.py" = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
  "ignore::DeprecationWarning:websockets.*",
]
