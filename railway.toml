# Railway deploy config. The Procfile sets the start command; this file is just
# documentation of the recommended deploy shape.
#
# Recommended (single service): create one Railway service from this repo and
# set BUNDLE_WORKER=true. The Procfile's `web` entry runs uvicorn; the bundled
# worker is spawned by the API process at startup.
#
# Two services (advanced): create a second service from the same repo and set
# its start command to `python -u -m api.workflow.worker`. Both services need
# the same DATABASE_URL; the worker doesn't need CORS_ORIGINS.

[build]
builder = "NIXPACKS"
